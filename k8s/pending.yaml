apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-cpu
  template:
    metadata:
      labels:
        app: pending-cpu
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          resources:
            requests:
              cpu: "100"